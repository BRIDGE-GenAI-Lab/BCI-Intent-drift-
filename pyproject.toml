[project]
name = "intent-drift"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "statsmodels>=0.14",
  "pyarrow>=15",
  "matplotlib>=3.8",
  "pdfplumber>=0.11",
  "sentence-transformers>=3.0",
  "transformers>=4.44",
  "torch>=2.2",
  "python-Levenshtein>=0.25",
  "tqdm>=4.66",
  "mne>=1.12.1",
  "wordfreq>=3.1.1",
  "spacy>=3.8.14",
]
[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
  "slow: real-model equivalence gate (rev Task 5.0); set IDRIFT_RUN_SLOW_TESTS=1 to run",
]
